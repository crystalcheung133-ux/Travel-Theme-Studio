<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travel Theme Studio</title><link rel="stylesheet" href="studio.css"></head><body>
<header><div><small>TRAVEL ENGINE</small><h1>Theme Studio</h1><p>Premium presets · safe fine-tuning · reusable themes</p></div><div class="actions"><button id="importBtn">Import</button><button id="exportBtn">Export Theme</button><input id="importFile" type="file" accept="application/json" hidden></div></header>
<main><aside><section><h2>Built-in Themes</h2><div id="presetGrid" class="theme-grid"></div></section><section><div class="section-title"><h2>My Themes</h2><span id="myCount"></span></div><div id="myThemes" class="theme-grid"></div></section><section><h2>Fine Tune</h2><div class="controls" id="controls"></div><div class="design-controls" id="designControls"></div><label>Logo treatment<select id="logoTreatment"><option value="blend">Blend In</option><option value="soft-disc">Soft Disc</option><option value="tone-tile">Tone-on-Tone Tile</option><option value="soft-card">Soft Card</option></select></label><div class="save-row"><button id="resetBtn">Reset</button><button class="primary" id="saveAsBtn">Save As New Theme</button></div></section></aside>
<section class="preview-area"><nav class="tabs"><button data-page="brand" class="active">Loading & Brand</button><button data-page="index.html">Home</button><button data-page="day.html">Day</button><button data-page="guide.html">Guide</button><button data-page="trip.html">Trip</button></nav><div id="brandPreview" class="brand-preview"><div class="logo-wrap" id="logoWrap"><div class="demo-logo">TC</div></div><h3>YOUR TRIP, YOUR COMPANION</h3><p>TRAVEL</p><div class="brand-demo-card"><b>Day 01 · Arrival</b><span>A soft preview of cards, surface and typography.</span><button>Open Journey</button></div><small>Logo treatment preview uses a neutral mark until a trip logo is supplied.</small></div><iframe id="engineFrame" title="Real Travel Engine preview"></iframe><div class="status" id="status"></div></section></main>
<script src="studio.js"></script></body></html>
